[project]
name = "translate"
version = "0.1.0"
description = "Offline translator"
requires-python = ">=3.11"

dependencies = [
    "flet>=0.86.4",
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "sentencepiece>=0.1.99",
    "sacremoses>=0.0.43",
    "pyspellchecker>=0.7.2",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"